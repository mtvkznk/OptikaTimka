name: Tests and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: optika_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlite://
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and development tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Lint and static security analysis
        run: |
          python -m ruff check .
          python -m bandit -r app -q
      - name: SQLite tests
        run: python -m pytest -q -p no:cacheprovider
      - name: PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-test-password@localhost:5432/optika_ci
        run: python -m pytest -q -p no:cacheprovider
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
