name: Tests and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: optika_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlite://
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and development tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Lint and static security analysis
        run: |
          python -m ruff check .
          python -m bandit -r app -q
      - name: SQLite tests
        run: python -m pytest -q -p no:cacheprovider
      - name: PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-test-password@localhost:5432/optika_ci
        run: python -m pytest -q -p no:cacheprovider
      - name: Compare migrated schemas with application models
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-test-password@localhost:5432/optika_ci
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/optika-schema.db"
          python -m alembic upgrade head
          python -m alembic check
          export DATABASE_URL="$TEST_DATABASE_URL"
          python -m alembic upgrade head
          python -m alembic check
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
      - name: Build and smoke-test production containers
        if: matrix.python == '3.12'
        env:
          OPTIKA_ENV_FILE: ${{ runner.temp }}/optika-prod.env
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          password = secrets.token_hex(32)
          config = {
              "ENVIRONMENT": "production",
              "PUBLIC_BASE_URL": "https://optika.invalid",
              "AUTH_SECRET": secrets.token_hex(32),
              "ADMIN_PASSWORD": secrets.token_hex(32),
              "POSTGRES_PASSWORD": password,
              "DATABASE_URL": f"postgresql+psycopg://optika_timka:{password}@db:5432/optika_timka",
          }
          Path(os.environ["OPTIKA_ENV_FILE"]).write_text("\n".join(f"{k}={v}" for k, v in config.items()))
          PY
          unset DATABASE_URL
          docker compose --env-file "$OPTIKA_ENV_FILE" -f docker-compose.prod.yml up -d --build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/admin)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/docs)" = 404
      - name: Show container diagnostics on failure
        if: failure() && matrix.python == '3.12'
        env:
          OPTIKA_ENV_FILE: ${{ runner.temp }}/optika-prod.env
        run: |
          unset DATABASE_URL
          if [ -f "$OPTIKA_ENV_FILE" ]; then
            docker compose --env-file "$OPTIKA_ENV_FILE" -f docker-compose.prod.yml logs --tail 80 app
          fi
      - name: Remove smoke-test containers
        if: always() && matrix.python == '3.12'
        env:
          OPTIKA_ENV_FILE: ${{ runner.temp }}/optika-prod.env
        run: |
          unset DATABASE_URL
          if [ -f "$OPTIKA_ENV_FILE" ]; then
            docker compose --env-file "$OPTIKA_ENV_FILE" -f docker-compose.prod.yml down -v
          fi
