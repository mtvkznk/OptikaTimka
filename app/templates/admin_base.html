{% from "brand.html" import wordmark %}<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="csrf-token" content="{{ request.state.csrf_token }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Адмінпанель{% endblock %} · {{ app_name }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/css/styles.css?v={{ admin_asset_version }}" />
    <link rel="stylesheet" href="/static/css/brand.css?v={{ admin_asset_version }}" />
    <link rel="stylesheet" href="/static/css/admin.css?v={{ admin_asset_version }}" />
    <script src="/static/js/admin.js?v={{ admin_asset_version }}" defer></script>
  </head>
  <body class="admin-body">
    <a class="admin-skip" href="#admin-content">До вмісту</a>
    <div class="admin-layout">
      <header class="admin-header">
        <div class="admin-header-inner">
          <a class="brand-link admin-brand" href="/admin">
            {{ wordmark("Адмінпанель") }}
          </a>
          <nav class="admin-nav" aria-label="Розділи адмінпанелі">
            <a href="/admin" data-admin-nav="appointments" aria-current="page">Записи</a>
            <a href="/admin#services" data-admin-nav="schedule">Послуги й графік</a>
            <a href="/admin#catalog" data-admin-nav="catalog">Каталог</a>
          </nav>
          <nav class="admin-exits" aria-label="Повернення на сайт">
            <a href="/cabinet">Кабінет <span aria-hidden="true">↗</span></a>
            <a href="/">На сайт <span aria-hidden="true">↗</span></a>
          </nav>
        </div>
      </header>
      <main class="admin-main" id="admin-content" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
      <div class="admin-save-bar">
        <div class="admin-save-inner">
          <p data-save-message role="status">Усі зміни збережено.</p>
          <div class="admin-save-actions">
            <button class="admin-button" type="button" data-admin-discard hidden>Скинути зміни</button>
            <button class="admin-button admin-primary" type="button" data-admin-save disabled>Зберегти зміни</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
