<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Запис на прийом в Optika Timka: оберіть послугу, дату та час."
    />
    <title>Запис на прийом | {{ app_name }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}" />
  </head>
  <body>
    <main class="booking-page">
      <section class="booking-shell" aria-labelledby="booking-title">
        <div class="booking-heading">
          <h1 id="booking-title">Запис на прийом</h1>
          <p>Оберіть послугу, зручну дату та час</p>
        </div>

        <form class="booking-card" data-appointment-form data-endpoint="/api/appointments">
          <label class="field field-wide">
            <span>Послуга</span>
            <select name="service" required>
              <option value="">Оберіть послугу</option>
              {% for service in services %}
              <option value="{{ service.name }}">{{ service.name }}</option>
              {% endfor %}
            </select>
          </label>

          <div class="booking-picker">
            <fieldset class="picker-field date-picker">
              <legend>Оберіть дату</legend>
              <div class="calendar-grid" aria-label="Календар доступних дат">
                {% for weekday in weekday_labels %}
                <span class="calendar-weekday">{{ weekday }}</span>
                {% endfor %}

                {% for week in booking_weeks %}
                  {% for day in week %}
                    {% if day %}
                    <label class="calendar-cell" title="{{ day.label }}">
                      <input type="radio" name="preferred_date" value="{{ day.value }}" required />
                      <span class="calendar-cell-inner">
                        <strong>{{ day.day }}</strong>
                        <small>{{ day.month_label }}</small>
                      </span>
                    </label>
                    {% else %}
                    <span class="calendar-empty" aria-hidden="true"></span>
                    {% endif %}
                  {% endfor %}
                {% endfor %}
              </div>
            </fieldset>

            <fieldset class="picker-field time-picker">
              <legend>Оберіть час</legend>
              <div class="time-grid" aria-label="Доступні години">
                {% for slot in time_slots %}
                <label class="time-cell">
                  <input type="radio" name="preferred_time" value="{{ slot.start_time.isoformat() }}" required />
                  <span class="time-cell-inner">
                    {{ format_time(slot.start_time) }} - {{ format_time(slot.end_time) }}
                  </span>
                </label>
                {% endfor %}
              </div>
            </fieldset>
          </div>

          <label class="field field-wide">
            <span>Ім'я та прізвище</span>
            <input name="name" type="text" placeholder="Наприклад, Іван Петренко" required />
          </label>

          <label class="field field-wide">
            <span>Телефон</span>
            <input
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="Наприклад, +380 67 123 45 67 або +48 123 456 789"
              pattern="\+?[0-9][0-9\s() -]{5,38}"
              title="Введіть номер у міжнародному або локальному форматі"
              required
            />
          </label>

          <button class="submit-button" type="submit">Підтвердити запис</button>
          <p class="form-status" role="status" data-form-status></p>
        </form>
      </section>
    </main>

    <script src="{{ url_for('static', path='/js/booking.js') }}"></script>
  </body>
</html>
