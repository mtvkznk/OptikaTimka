{% if pages > 1 %}
<nav class="public-nav pagination" aria-label="Сторінки записів">
  {% if page > 1 %}<a href="{{ pagination_path }}?page={{ page - 1 }}">← Попередня</a>{% endif %}
  <span>{{ page }} / {{ pages }}</span>
  {% if page < pages %}<a href="{{ pagination_path }}?page={{ page + 1 }}">Наступна →</a>{% endif %}
</nav>
{% endif %}
