services:
  db:
    image: postgres:16-alpine
    container_name: optika_timka_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: optika_timka
      POSTGRES_USER: optika_timka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
    volumes:
      - optika_timka_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optika_timka -d optika_timka"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: optika_timka_app:latest
    container_name: optika_timka_prod_app
    restart: unless-stopped
    env_file:
      - path: ${OPTIKA_ENV_FILE:-C:/Deploy/OptikaTimka/prod.env}
        required: true
    environment:
      APP_NAME: Optika Timka
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:8080:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  optika_timka_prod_postgres_data:
