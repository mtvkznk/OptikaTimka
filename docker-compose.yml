services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: optika_timka
      POSTGRES_USER: optika
      POSTGRES_PASSWORD: optika
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optika -d optika_timka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
