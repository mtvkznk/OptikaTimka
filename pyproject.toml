[project]
name = "optika-timka"
version = "0.1.0"
description = "FastAPI backend for the Optika Timka website."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "certifi>=2026.10.19",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.4",
  "pillow>=13.0.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.32.0",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
